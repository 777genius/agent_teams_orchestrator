name: OpenCode V2 Intel macOS smoke

on:
  push:
    branches: [feat/opencode-v2-intel-macos]
  pull_request:
    paths:
      - .github/workflows/opencode-v2-intel-smoke.yml
      - src/services/opencode/compatibility/opencode-v2-qualifications.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intel:
    name: Native Intel packaging and V2 server
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Check qualification and packaging contracts
        run: bun test src/services/opencode/compatibility/OpenCodeV2Registry.test.ts scripts/opencode-v2/stage.test.ts scripts/opencode-v2/delivery.test.ts --timeout 30000
      - name: Build native Intel runtime and support archive
        env:
          RUNTIME_OPENCODE_V2: bundled
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          bun scripts/package-runtime.ts --platform darwin-x64
          test -f dist/opencode-v2-delivery.json
      - name: Start packaged V2 server on Intel
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/TEST-intel-runtime"
          support="$RUNNER_TEMP/TEST-intel-support"
          mkdir -p "$base" "$support"
          cp dist/opencode-delivery.json dist/opencode-v2-delivery.json dist/VERSION dist/COMMIT_SHA "$base/"
          cp -R dist/local-cli dist/bun "$base/"
          archive="$(bun --no-install -e 'console.log(JSON.parse(await Bun.file("dist/opencode-v2-delivery.json").text()).archive.file)')"
          unzip -q "dist/$archive" -d "$support"
          "$base/bun/bun" --no-install --no-env-file scripts/opencode-v2/packaged-server-smoke.ts "$base" "$support" "$RUNNER_TEMP/TEST-intel-server.json"
      - name: Preserve smoke result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-v2-intel-${{ github.sha }}
          path: |
            ${{ runner.temp }}/TEST-intel-server.json
            ${{ runner.temp }}/TEST-intel-server.json.progress.ndjson
          if-no-files-found: warn
