name: OpenCode directory compatibility

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/services/opencode/ensureOpenCodeDirectory*'
      - 'src/services/opencode/OpenCodePrivateMcp*'
      - 'src/services/opencode/OpenCodeProfileManager.ts'
      - '.github/workflows/opencode-directories.yml'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/services/opencode/ensureOpenCodeDirectory*'
      - 'src/services/opencode/OpenCodePrivateMcp*'
      - 'src/services/opencode/OpenCodeProfileManager.ts'
      - '.github/workflows/opencode-directories.yml'

permissions:
  contents: read

concurrency:
  group: opencode-directories-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  directory-compatibility:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Directory compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # Builtin-only tests intentionally cover the Bun version embedded in 2.14.2.
      - name: Test directory compatibility
        run: bun test --timeout 30000 src/services/opencode/ensureOpenCodeDirectory.test.ts src/services/opencode/OpenCodePrivateMcpConfig.test.ts
      - name: Test foreign ownership refusal in isolated root-owned temporary fixture
        if: runner.os == 'Linux'
        run: sudo env TMPDIR=/tmp "$(command -v bun)" test src/services/opencode/OpenCodePrivateMcpConfig.test.ts --test-name-pattern 'rejects a foreign-owned existing file'
