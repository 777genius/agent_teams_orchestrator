name: Isolated OAuth recovery startup diagnostic

on:
  workflow_dispatch:
    inputs:
      full:
        description: Existing dispatch compatibility input; one exact authority run
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  recovery-startup-diagnostic:
    name: Diagnostic only — full authority with recovery phase trace
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the same frozen default graph as Windows authority
        run: bun install --frozen-lockfile
      - name: Run the exact full authority group once with phase evidence
        run: bun scripts/ci/runtime-recovery-startup-diagnostic.ts
      - name: Preserve small diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-recovery-startup-diagnostic-${{ github.sha }}
          path: runtime-recovery-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
