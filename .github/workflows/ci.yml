name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
  pull_request:
    paths:
      - 'src/**'
      - 'native/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  posix-passive-snapshot:
    name: POSIX passive snapshot publication
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test immutable passive publication on a supported platform
        run: >-
          bun test
          src/services/opencode/OpenCodePassiveStatusSnapshotWriter.test.ts
          src/services/opencode/OpenCodePassiveStatusProductionReader.test.ts
          src/services/opencode/OpenCodeActiveStatusSnapshotPublisher.test.ts

  windows-passive-snapshot:
    name: Windows retained publication (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: x64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build and test retained native authority
        run: |
          cargo test --locked --manifest-path native/opencode-catalog-authority/Cargo.toml
          cargo test --locked --manifest-path native/opencode-catalog-launcher/Cargo.toml
          cargo build --locked --manifest-path native/opencode-catalog-authority/Cargo.toml
          cargo build --locked --manifest-path native/opencode-catalog-launcher/Cargo.toml
      - name: Test publication protocol and integrations
        timeout-minutes: 15
        run: >-
          bun test
          src/services/opencode/OpenCodeCatalogCrossPlatformContract.test.ts
          src/services/opencode/OpenCodeWindowsPublicationAuthorityProtocol.test.ts
          src/services/opencode/OpenCodeWindowsPublicationAuthorityClient.test.ts
          src/services/opencode/OpenCodeWindowsPassiveReadAuthority.test.ts
          src/services/opencode/OpenCodeWindowsRetainedCallerLayer.test.ts
          src/services/opencode/OpenCodeSafePublication.test.ts
          src/services/opencode/OpenCodeScopedProfileAuthPublication.test.ts
          src/services/opencode/OpenCodeProviderCatalogService.test.ts
          src/services/opencode/OpenCodePassiveSnapshotConsistency.test.ts
          src/services/opencode/OpenCodePassiveStatusSnapshotWriter.test.ts
          src/services/opencode/OpenCodePassiveStatusProductionReader.test.ts
          src/services/opencode/OpenCodePassiveSnapshotPersistencePolicy.test.ts
          src/services/runtimeBackends/openCodePassiveStatus.test.ts
      - name: Prove native NTFS handle retention
        run: bun test scripts/windows-publication-native.test.ts
      - name: Build and compile runtime
        run: |
          bun run build
          bun run compile
      - name: Test packaged native pair
        shell: pwsh
        run: |
          $env:OPENCODE_WINDOWS_NATIVE_ARTIFACT_DIR = (Resolve-Path dist)
          bun test scripts/windows-publication-native.test.ts

  task-change-ledger:
    name: Task change ledger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test task change ledger
        run: bun run test:task-change-ledger

      - name: Build dev runtime
        run: bun run build:dev
