name: CI

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'

permissions:
  contents: read

jobs:
  hosted-control:
    name: Hosted control
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test hosted control
        run: bun run test:hosted-control

      - name: Typecheck
        run: bun run tsc --noEmit

      - name: Build production runtime
        run: bun run build

  task-change-ledger:
    name: Task change ledger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test task change ledger
        run: bun run test:task-change-ledger

      - name: Build dev runtime
        run: bun run build:dev
