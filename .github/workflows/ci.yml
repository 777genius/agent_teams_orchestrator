name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run Windows authority, packaged candidate and native conformance
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
      authority_os: ${{ steps.scope.outputs.authority_os }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test gating contracts in isolated TEST scratch
        run: |
          mkdir -p "$RUNNER_TEMP/TEST-ci-policy"
          TMPDIR="$RUNNER_TEMP/TEST-ci-policy" node --test scripts/ci/policy.test.ts
      - name: Classify event changes
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FULL: ${{ inputs.full }}
        run: node scripts/ci/policy.ts classify
      - name: Explain selected checks
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: printf '%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

  windows-packaged-backfill:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    name: Windows packaged backfill (candidate)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate fixture and rejecting assertions
        timeout-minutes: 2
        working-directory: harness
        shell: pwsh
        env:
          BACKFILL_WINDOWS_TEST_EVIDENCE: ${{ github.workspace }}/backfill-windows-process-test.json
        run: |
          $env:BACKFILL_RUNTIME_HARNESS_COMMIT = git rev-parse HEAD
          node --test scripts/smoke/windows-runtime-opencode-backfill.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows fixture/process test failed; see process-test evidence' }
      - name: Install frozen runtime dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile
      - name: Test native Codex approval transport
        working-directory: runtime
        run: bun test src/services/codexNative/replApprovalTransport.test.ts src/services/codexNative/replTurnBridge.test.ts src/services/codexNative/appServerRunner.test.ts
      # Same compile command and native Windows target as release-runtime.yml.
      - name: Compile Windows runtime
        working-directory: runtime
        run: bun run compile
      - name: Run packaged backfill and provider JSON smoke
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:BACKFILL_RUNTIME_SOURCE_COMMIT = git -C runtime rev-parse HEAD
          $env:BACKFILL_RUNTIME_HARNESS_COMMIT = git -C harness rev-parse HEAD
          if ($env:BACKFILL_RUNTIME_SOURCE_COMMIT -ne $env:BACKFILL_RUNTIME_HARNESS_COMMIT) { throw 'Harness/runtime commit mismatch' }
          $env:BACKFILL_RUNTIME_BUN_VERSION = bun --version
          node harness/scripts/smoke/windows-runtime-opencode-provider-json.mjs runtime/dist/cli.exe backfill-candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows smoke failed; see captured evidence' }
      - name: Preserve Windows runtime candidate for paired desktop qualification
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-runtime-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime/dist/cli.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload executable regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-backfill-candidate
          path: |
            backfill-candidate.json
            backfill-windows-process-test.json
          if-no-files-found: warn

  cursor-managed-plugin:
    name: Cursor managed plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned plugin dependencies
        working-directory: scripts/cursor-plugin
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify scoped shell cancellation and MCP dispatch
        run: node --test scripts/cursor-plugin/shell-cancellation.test.mjs scripts/cursor-plugin/managed-mcp-dispatch.test.mjs
      - name: Verify reproducible managed plugin artifact
        run: bun test scripts/cursor-plugin/build.test.ts

  task-change-ledger:
    name: Task change ledger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test client identity and headless runtime
        run: bun test src/utils/clientVersion.test.ts src/utils/renderOptions.test.ts src/utils/headlessInputPrompt.test.ts

      - name: Test native Codex approval transport
        run: bun test src/services/codexNative/replApprovalTransport.test.ts src/services/codexNative/replTurnBridge.test.ts src/services/codexNative/appServerRunner.test.ts

      - name: Test mailbox publications and lifecycle
        run: bun test src/utils/teammateMailbox.test.ts src/hooks/ordinaryMailboxMessage.test.ts src/cli/print.groupMailbox.test.ts

      - name: Test task change ledger
        run: bun run test:task-change-ledger

      - name: Build dev runtime
        run: bun run build:dev

  opencode-authority:
    needs: scope
    name: OpenCode selected authority (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows recovery fixtures spend ~20 minutes in real process-identity
    # queries; the 25-minute job cap interrupted 1065 passing cases after setup.
    # Leave room for the remaining suites without changing operation deadlines.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.authority_os) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The Cursor preload contract is proven by spawning a real node process,
      # the same interpreter cursor-agent runs under.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test selected authority and sandbox lifecycle
        # Native Windows fixtures perform several process-identity queries and
        # child startups per test; the default 5s can expire during valid work.
        # Production operation deadlines remain enforced inside the tests.
        run: bun run test:opencode-authority --timeout ${{ runner.os == 'Windows' && '30000' || '5000' }}
      - name: Test provider settings and HTTP body deadlines
        run: bun test src/features/runtimeProviderManagement/adapters/opencode/OpenCodeProviderManagementAdapter.test.ts src/services/opencode/OpenCodeProviderIdentity.test.ts src/services/opencode/OpenCodeInventoryService.test.ts src/services/opencode/OpenCodeProviderLabelRegression.test.ts src/services/opencode/OpenCodeClientFactory.test.ts --timeout 30000
      - name: Test Windows startup cleanup completion contracts
        run: bun test src/utils/processKill.test.ts src/services/opencode/OpenCodeStartupCleanupBudget.test.ts src/services/opencode/OpenCodeStartupCleanup.test.ts --timeout 30000
      - name: Test native Windows startup termination
        if: runner.os == 'Windows'
        run: bun test src/services/opencode/OpenCodeStartupCleanup.native.test.ts
      - name: Require Python for Linux OS pipe regression
        if: runner.os == 'Linux'
        run: python3 --version
      - name: Test runtime status and adjacent output boundaries
        run: bun test src/cli/handlers/runtime.status-stdout.test.ts src/cli/handlers/runtime.providers-stdout.test.ts src/cli/handlers/runtime.verify-stdout.test.ts src/cli/runtimeStatusCommand.entry.test.ts src/utils/sleep.test.ts

  opencode-conformance:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    name: OpenCode ${{ matrix.version }} conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: '1.18.4'
            asset: opencode-linux-x64.tar.gz
            archiveSha256: bab463c3fb3224d388bb7cfad63f38703df9cf0be2cfd2ce8cb49d886b53a174
          - os: ubuntu-latest
            version: '1.18.29'
            asset: opencode-linux-x64.tar.gz
            archiveSha256: ea800b7ff56226b70952126c9fc1e2517ca4c4b5682fd9d3f9e87449697a1194
          - os: windows-latest
            version: '1.18.29'
            asset: opencode-windows-x64.zip
            archiveSha256: b32618aa3d1415f6e4f473aec248edef25759203fb707d7d968359d86d4a35ee
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install conformance test dependencies
        run: bun install --frozen-lockfile
      - name: Download and verify pinned OpenCode archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_VERSION: ${{ matrix.version }}
          PINNED_ASSET: ${{ matrix.asset }}
          PINNED_SHA256: ${{ matrix.archiveSha256 }}
        run: |
          $binaryRoot = Join-Path $env:RUNNER_TEMP 'opencode-authority-binary-TEST'
          New-Item -ItemType Directory -Path $binaryRoot | Out-Null
          gh release download "v$env:PINNED_VERSION" --repo anomalyco/opencode --pattern $env:PINNED_ASSET --dir $binaryRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned download failed' }
          $archive = Join-Path $binaryRoot $env:PINNED_ASSET
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PINNED_SHA256) { throw 'Pinned archive digest mismatch' }
          if ($IsWindows) {
            Expand-Archive -Path $archive -DestinationPath $binaryRoot
            $binary = Join-Path $binaryRoot 'opencode.exe'
          } else {
            tar -xzf $archive -C $binaryRoot
            if ($LASTEXITCODE -ne 0) { throw 'Pinned extraction failed' }
            $binary = Join-Path $binaryRoot 'opencode'
          }
          "AUTHORITY_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AUTHORITY_BINARY_SHA256=$((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test harness and real OpenCode without inference
        shell: pwsh
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          bun test scripts/opencode-authority-conformance.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Conformance harness tests failed' }
          foreach ($permissionMode in @('auto', 'manual')) {
            bun scripts/opencode-authority-conformance.ts $env:AUTHORITY_BINARY $env:PINNED_VERSION $env:AUTHORITY_BINARY_SHA256 $permissionMode > "conformance-$permissionMode.json"
            if ($LASTEXITCODE -ne 0) { throw "Real OpenCode $permissionMode conformance failed" }
          }
          if (-not $IsWindows) {
            bun scripts/opencode-permission-conformance.ts $env:AUTHORITY_BINARY $env:PINNED_VERSION $env:AUTHORITY_BINARY_SHA256 > conformance-permission.json
            if ($LASTEXITCODE -ne 0) { throw 'Real permission engine conformance failed' }
          }
      - name: Full selected authority with connected MCP in isolated container
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          bun build scripts/opencode-selected-authority-conformance.ts --target=bun --packages=bundle --define 'process.env.USER_TYPE="external"' --outfile=selected-authority-harness.js
          if ($LASTEXITCODE -ne 0) { throw 'Selected authority harness build failed' }
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,size=512m --memory 1g --cpus 1 -v "${env:GITHUB_WORKSPACE}/selected-authority-harness.js:/harness.js:ro" -v "${env:AUTHORITY_BINARY}:/opencode:ro" oven/bun@sha256:0733e50325078969732ebe3b15ce4c4be5082f18c4ac1a0f0ca4839c2e4e42a7 bun /harness.js /opencode $env:PINNED_VERSION $env:AUTHORITY_BINARY_SHA256 > conformance-selected-authority.json
          if ($LASTEXITCODE -ne 0) { throw 'Full selected authority conformance failed' }
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-conformance-${{ matrix.os }}-${{ matrix.version }}
          path: conformance-*.json
          if-no-files-found: ignore

  packaged-delivery:
    name: Packaged delivery (${{ matrix.platform }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: claude-multimodel
            binary: dist/cli
          - os: windows-latest
            platform: win32-x64
            executable: claude-multimodel.exe
            binary: dist/cli.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen portable dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Test native compiled delegation and cancellation
        run: bun test src/cli/packagedOpenCodeDelivery.test.ts
      - name: Produce physical JS and native front door
        run: bun scripts/package-runtime.ts --platform ${{ matrix.platform }}
      - name: Verify and archive complete candidate delivery
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_BINARY: ${{ matrix.binary }}
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "$CANDIDATE_BINARY" --version | grep -Fx '2.777.777 (Claude Code)'
          mkdir -p candidate/runtime
          bun scripts/ci/verify-packaged-delivery.ts
          cp "$CANDIDATE_BINARY" "candidate/runtime/$CANDIDATE_EXECUTABLE"
          cp dist/opencode-delivery.json candidate/runtime/opencode-delivery.json
          cp -R dist/local-cli dist/bun dist/cursor-managed candidate/runtime/
          printf '%s\n' "$CANDIDATE_SOURCE_SHA" > candidate/runtime/COMMIT_SHA
          tar -czf "candidate-$CANDIDATE_PLATFORM.tar.gz" -C candidate runtime
      - name: Preserve exact-head candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: packaged-delivery-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  required:
    name: CI required
    if: always()
    needs: [scope, cursor-managed-plugin, task-change-ledger, opencode-authority, windows-packaged-backfill, opencode-conformance, packaged-delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require every selected check and explain optional skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/policy.ts aggregate >> "$GITHUB_STEP_SUMMARY"
