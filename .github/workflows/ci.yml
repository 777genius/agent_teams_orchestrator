name: Runtime128 smoke alias diagnostic

on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the isolated Windows native alias pair and corrected delivery smoke
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  windows-smoke-alias:
    name: Windows 2022 immutable128 alias discriminator
    if: inputs.full == true
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BACKFILL_RUNTIME_SOURCE_COMMIT: e1892ddd32230736c29469d5347a1b659cd49945
      BACKFILL_RUNTIME_HARNESS_COMMIT: ${{ github.sha }}
      BACKFILL_RUNTIME_BUN_VERSION: '1.4.2'
      EXPECTED_CLAUDE_CODE_VERSION: '2.777.777'
    steps:
      - name: Checkout immutable runtime128 source
        uses: actions/checkout@v6
        with:
          ref: e1892ddd32230736c29469d5347a1b659cd49945
          path: runtime
          persist-credentials: false

      - name: Checkout diagnostic harness
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false

      - name: Setup release compiler Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Setup release smoke Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Verify exact source and harness checkouts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = (git -C runtime rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -ne $env:BACKFILL_RUNTIME_SOURCE_COMMIT) {
            throw 'Runtime checkout must match immutable runtime128 source'
          }
          $harness = (git -C harness rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $harness -ne $env:GITHUB_SHA -or $harness -ne $env:BACKFILL_RUNTIME_HARNESS_COMMIT) {
            throw 'Harness checkout must match the diagnostic workflow commit'
          }
          $buildBun = (& bun --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $buildBun -ne $env:BACKFILL_RUNTIME_BUN_VERSION) {
            throw 'Release compiler Bun must be 1.4.2'
          }
          $nodeVersion = (& node --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $nodeVersion -notmatch '^v24\.') {
            throw 'Release smoke requires Node 24'
          }

      - name: Reserve fresh absolute TEST evidence path
        id: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP ('TEST-runtime128-smoke-alias-' + [guid]::NewGuid().ToString('N'))
          if (-not [System.IO.Path]::IsPathFullyQualified($directory) -or (Test-Path -LiteralPath $directory)) {
            throw 'Controller requires a fresh absolute TEST evidence directory'
          }
          "directory=$directory" >> $env:GITHUB_OUTPUT

      # These three build commands match the Windows x64 release-runtime.yml lane.
      - name: Install frozen runtime dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile --linker hoisted

      - name: Compile Windows x64 native assets
        working-directory: runtime
        run: bun scripts/opencode-v2/compile-windows.ts

      - name: Build packaged runtime delivery
        working-directory: runtime
        run: bun run ./scripts/package-runtime.ts --platform win32-x64

      - name: Verify compiled version and shipped Bun
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actualVersion = (& .\runtime\dist\cli.exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion.Split(' ')[0] -ne $env:EXPECTED_CLAUDE_CODE_VERSION) {
            throw 'Compiled Claude Code version must be 2.777.777'
          }
          $shippedBun = (& .\runtime\dist\bun\bun.exe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $shippedBun -ne '1.4.3') {
            throw 'Physical Windows delivery must ship Bun 1.4.3'
          }
          $identity = Get-Content -LiteralPath .\runtime\dist\opencode-delivery.json -Raw | ConvertFrom-Json
          if ($identity.schema -ne 1 -or $identity.platform -ne 'win32' -or $identity.arch -ne 'x64' -or $identity.bunVersion -ne '1.4.3') {
            throw 'Physical Windows delivery identity mismatch'
          }

      - name: Run native alias pair and corrected full delivery smoke
        timeout-minutes: 21
        shell: pwsh
        env:
          TEST_EVIDENCE_DIRECTORY: ${{ steps.evidence.outputs.directory }}
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeDist = (Resolve-Path -LiteralPath .\runtime\dist).Path
          $controller = (Resolve-Path -LiteralPath .\harness\scripts\ci\runtime128-smoke-alias-discriminator.mjs).Path
          $smokeEntry = (Resolve-Path -LiteralPath .\harness\scripts\smoke\windows-runtime-opencode-provider-json.mjs).Path
          if (Test-Path -LiteralPath $env:TEST_EVIDENCE_DIRECTORY) {
            throw 'Do not reuse an existing evidence directory'
          }
          node $controller $runtimeDist $smokeEntry $env:TEST_EVIDENCE_DIRECTORY
          if ($LASTEXITCODE -ne 0) {
            throw 'Immutable128 native alias discriminator or corrected delivery smoke failed; inspect raw evidence'
          }

      - name: Upload bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime128-smoke-alias-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ steps.evidence.outputs.directory }}
          if-no-files-found: warn
          retention-days: 7
