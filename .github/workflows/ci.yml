name: Isolated runtime status startup diagnostic

on:
  workflow_dispatch:
    inputs:
      full:
        description: Existing CI dispatch compatibility input; diagnostic remains one fixed pair
        type: boolean
        default: true
        required: true

permissions:
  contents: read

jobs:
  status-startup-diagnostic:
    name: Diagnostic only — untouched status group then traced group
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the same frozen default graph as Windows authority
        run: bun install --frozen-lockfile
      - name: Run the exact authority group once untouched and once traced
        run: bun scripts/ci/runtime-status-startup-diagnostic.ts
      - name: Preserve small diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-status-startup-diagnostic-${{ github.sha }}
          path: runtime-status-diagnostic-evidence/
          if-no-files-found: error
          retention-days: 7
