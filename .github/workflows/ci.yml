name: TEST Windows 110 compiled catalog admission diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d64fda3f249153e1d6a828817343a508053099b9
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent-teams-ai
          ref: 209bdab0c2d09c0b14dd186d55a70701fc470712
          path: product
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/e2e/opencode-diagnostics/packaged.mjs
            /scripts/e2e/opencode-diagnostics/platform.mjs
            /src/main/utils/cliPathMerge.ts
            /src/main/utils/cliProcessDefaults.ts
            /src/main/services/runtime/openCodeRuntimeBinaryEnv.ts
            /src/main/services/runtime/openCodeAutoUpdatePolicy.ts
            /src/main/services/runtime/providerAwareCliEnv.ts
            /src/main/services/runtime/buildRuntimeBaseEnv.ts
            /src/main/services/runtime/providerRuntimeEnv.ts
            /src/main/services/runtime/agentTeamsMcpLaunchEnv.ts
            /src/main/services/runtime/ProviderConnectionService.ts
            /src/main/services/identity/AgentTeamsIdentityStore.ts
            /src/main/services/infrastructure/ConfigManager.ts
            /src/main/utils/pathDecoder.ts
            /src/main/utils/cliEnv.ts
            /scripts/stage-opencode-console-wrapper.mjs
            /tools/opencode-console-wrapper/OpenCodeConsoleWrapper.cs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Stage immutable published Windows runtime
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'runtime110.zip'
          Invoke-WebRequest -Uri 'https://github.com/777genius/agent_teams_orchestrator_binaries/releases/download/runtime-v0.0.110/agent-teams-runtime-win32-x64-v0.0.110.zip' -OutFile $zip
          if ((Get-Item $zip).Length -ne 265993905 -or (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '9dd23b817928413b869fd283bc9bd64652ea74c51dbb9e3d31e88c2ede25d462') { throw 'Release archive mismatch' }
          $resources = Join-Path $env:GITHUB_WORKSPACE 'packaged-root/resources'
          New-Item -ItemType Directory $resources | Out-Null
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($zip)
          try {
            $prefix = [IO.Path]::GetFullPath($resources) + [IO.Path]::DirectorySeparatorChar
            $names = [Collections.Generic.HashSet[string]]::new([StringComparer]::OrdinalIgnoreCase)
            foreach ($entry in $archive.Entries) {
              $name = $entry.FullName
              if (-not $name.StartsWith('runtime/') -or $name.Contains('\') -or $name.Contains(':') -or ($name.Split('/') | Where-Object { $_ -eq '.' -or $_ -eq '..' }).Count) { throw 'Release entry path refused' }
              $full = [IO.Path]::GetFullPath([IO.Path]::Combine($resources, $name))
              if (-not $full.StartsWith($prefix, [StringComparison]::OrdinalIgnoreCase) -or -not $names.Add($name.TrimEnd('/'))) { throw 'Release entry containment/alias refused' }
              $kind = ($entry.ExternalAttributes -shr 16) -band 0xf000
              if ($kind -notin @(0, 0x4000, 0x8000)) { throw 'Release link/special entry refused' }
            }
          } finally { $archive.Dispose() }
          [IO.Compression.ZipFile]::ExtractToDirectory($zip, $resources)
      - name: Prepare exact Product wrapper and observe compiled catalog once
        shell: pwsh
        run: |
          $source = git -C runtime rev-parse HEAD
          if ($source -ne 'd64fda3f249153e1d6a828817343a508053099b9') { throw 'Source mismatch' }
          $product = git -C product rev-parse HEAD
          if ($product -ne '209bdab0c2d09c0b14dd186d55a70701fc470712') { throw 'Product source mismatch' }
          node product/scripts/stage-opencode-console-wrapper.mjs --platform win32-x64 --require
          if ($LASTEXITCODE -ne 0) { throw 'Product wrapper build failed' }
          $env:TEST_SOURCE_COMMIT = $source
          $env:TEST_PRODUCT_SOURCE_COMMIT = $product
          $env:TEST_PRODUCT_ROOT = "$env:GITHUB_WORKSPACE/product"
          $env:TEST_RUNTIME_RESOURCES = "$env:GITHUB_WORKSPACE/packaged-root/resources"
          $env:TEST_RUNTIME_ARCHIVE = "$env:GITHUB_WORKSPACE/runtime110.zip"
          $env:TEST_WRAPPER_EXECUTABLE = "$env:GITHUB_WORKSPACE/product/resources/runtime/opencode-console/opencode.exe"
          $env:TEST_VERSION_DIAGNOSTIC_TRACE = "$env:GITHUB_WORKSPACE/version-ownership-trace.jsonl"
          $env:TEST_VERSION_DIAGNOSTIC_RESULT = "$env:GITHUB_WORKSPACE/version-ownership-result.json"
          bun harness/scripts/diagnostic/windows110-version-probe.ts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic contract failed' }
      - name: Preserve finite chronology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST-windows110-version-ownership
          path: |
            version-ownership-trace.jsonl
            version-ownership-result.json
          if-no-files-found: warn
