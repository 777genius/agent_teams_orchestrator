name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run Windows authority, packaged candidate and native conformance
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && (github.event.pull_request.number || github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native }}
      authority_os: ${{ steps.scope.outputs.authority_os }}
      reason: ${{ steps.scope.outputs.reason }}
      v2_linux: ${{ steps.scope.outputs.v2_linux }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test gating contracts in isolated TEST scratch
        run: |
          mkdir -p "$RUNNER_TEMP/TEST-ci-policy"
          TMPDIR="$RUNNER_TEMP/TEST-ci-policy" node --test scripts/ci/policy.test.ts
      - name: Classify event changes
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FULL: ${{ inputs.full }}
        run: node scripts/ci/policy.ts classify
      - name: Explain selected checks
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: printf '%s\n' "$REASON" >> "$GITHUB_STEP_SUMMARY"

  windows-packaged-backfill:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    name: Windows packaged backfill (candidate)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.3' || '1.3.11' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen harness dependencies
        working-directory: harness
        run: bun install --frozen-lockfile
      - name: Validate fixture and rejecting assertions
        timeout-minutes: 2
        working-directory: harness
        shell: pwsh
        env:
          BACKFILL_WINDOWS_TEST_EVIDENCE: ${{ github.workspace }}/backfill-windows-process-test.json
        run: |
          $env:BACKFILL_RUNTIME_HARNESS_COMMIT = git rev-parse HEAD
          node --test scripts/smoke/windows-runtime-opencode-backfill.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows fixture/process test failed; see process-test evidence' }
      - name: Install frozen runtime dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile
      - name: Test native Codex approval transport
        working-directory: runtime
        run: bun test src/services/codexNative src/components/MessageSelector.test.ts src/utils/sessionStorage.persistence.test.ts src/utils/cleanup.codexLocks.test.ts
      # Same compile command and native Windows target as release-runtime.yml.
      - name: Compile Windows runtime
        working-directory: runtime
        run: bun run compile
      - name: Run packaged backfill and provider JSON smoke
        timeout-minutes: 12
        shell: pwsh
        run: |
          $env:BACKFILL_RUNTIME_SOURCE_COMMIT = git -C runtime rev-parse HEAD
          $env:BACKFILL_RUNTIME_HARNESS_COMMIT = git -C harness rev-parse HEAD
          if ($env:BACKFILL_RUNTIME_SOURCE_COMMIT -ne $env:BACKFILL_RUNTIME_HARNESS_COMMIT) { throw 'Harness/runtime commit mismatch' }
          $env:BACKFILL_RUNTIME_BUN_VERSION = bun --version
          node harness/scripts/smoke/windows-runtime-opencode-provider-json.mjs runtime/dist/cli.exe backfill-candidate.json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows smoke failed; see captured evidence' }
      - name: Preserve Windows runtime candidate for paired desktop qualification
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-runtime-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: runtime/dist/cli.exe
          if-no-files-found: error
          retention-days: 7
      - name: Upload executable regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-packaged-backfill-candidate
          path: |
            backfill-candidate.json
            backfill-windows-process-test.json
          if-no-files-found: warn

  cursor-managed-plugin:
    name: Cursor managed plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.3' || '1.3.11' }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install pinned plugin dependencies
        working-directory: scripts/cursor-plugin
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify scoped shell cancellation and MCP dispatch
        run: node --test scripts/cursor-plugin/shell-cancellation.test.mjs scripts/cursor-plugin/managed-mcp-dispatch.test.mjs
      - name: Verify reproducible managed plugin artifact
        run: bun test scripts/cursor-plugin/build.test.ts

  task-change-ledger:
    name: Task change ledger (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.3' || '1.3.11' }}

      - name: Install pinned native Codex in isolated TEST directory
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/TEST-codex-native-cli"
          bun add --cwd "$RUNNER_TEMP/TEST-codex-native-cli" --no-save @openai/codex@0.135.0

      - name: Verify native conversation storage and exact resume
        if: runner.os == 'Linux'
        timeout-minutes: 6
        run: >-
          python3 scripts/codex-native-continuity-spike.py
          --codex "$RUNNER_TEMP/TEST-codex-native-cli/node_modules/.bin/codex"
          --expect-version 'codex-cli 0.135.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test client identity and headless runtime
        run: bun test src/utils/clientVersion.test.ts src/utils/renderOptions.test.ts src/utils/headlessInputPrompt.test.ts

      - name: Test native Codex approval transport
        run: bun test src/services/codexNative src/components/MessageSelector.test.ts src/utils/sessionStorage.persistence.test.ts src/utils/cleanup.codexLocks.test.ts

      - name: Test mailbox publications and lifecycle
        run: bun test src/utils/teammateMailbox.test.ts src/hooks/ordinaryMailboxMessage.test.ts src/cli/print.groupMailbox.test.ts

      - name: Test task change ledger
        run: bun run test:task-change-ledger

      - name: Verify native Codex lead and teammate conversation continuity
        if: runner.os == 'Linux' && !cancelled()
        timeout-minutes: 8
        run: >-
          bun scripts/codex-native-continuity-e2e.ts
          --codex "$RUNNER_TEMP/TEST-codex-native-cli/node_modules/.bin/codex"
          --evidence-file "$RUNNER_TEMP/TEST-codex-continuity-evidence.json"

      - name: Upload native Codex continuity evidence
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-conversation-continuity
          path: ${{ runner.temp }}/TEST-codex-continuity-evidence.json
          if-no-files-found: ignore

      - name: Build dev runtime
        run: bun run build:dev

  opencode-authority:
    needs: scope
    name: OpenCode selected authority (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows recovery fixtures spend ~20 minutes in real process-identity
    # queries; the 25-minute job cap interrupted 1065 passing cases after setup.
    # Leave room for the remaining suites without changing operation deadlines.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.authority_os) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.3' || '1.3.11' }}
      # The Cursor preload contract is proven by spawning a real node process,
      # the same interpreter cursor-agent runs under.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test selected authority and sandbox lifecycle
        # Native Windows fixtures perform several process-identity queries and
        # child startups per test; the default 5s can expire during valid work.
        # Production operation deadlines remain enforced inside the tests.
        run: bun run test:opencode-authority --timeout ${{ runner.os == 'Windows' && '30000' || '5000' }}
      - name: Test provider settings and HTTP body deadlines
        run: bun test src/features/runtimeProviderManagement/adapters/opencode/OpenCodeProviderManagementAdapter.test.ts src/services/opencode/OpenCodeProviderIdentity.test.ts src/services/opencode/OpenCodeInventoryService.test.ts src/services/opencode/OpenCodeProviderLabelRegression.test.ts src/services/opencode/OpenCodeClientFactory.test.ts --timeout 30000
      - name: Test V2 provider discovery and project identity
        run: >-
          bun test
          src/features/runtimeProviderManagement/adapters/opencode/OpenCodeV2ProviderDirectory.test.ts
          src/features/runtimeProviderManagement/adapters/opencode/OpenCodeV2ProviderSetupForm.test.ts
          src/features/runtimeProviderManagement/adapters/opencode/OpenCodeV2ProviderManagement.project-identity.test.ts
          src/services/opencode/catalog/OpenCodeV2ReadStatus.test.ts
          src/services/opencode/catalog/OpenCodeV2KeyIntegrations.test.ts
          --timeout 30000
      - name: Test V2 provider routing in isolation
        run: bun test src/features/runtimeProviderManagement/adapters/opencode/OpenCodeProviderManagementAdapter.v2-routing.test.ts --timeout 30000
      - name: Test provider selection failures in isolation
        run: bun test src/features/runtimeProviderManagement/adapters/opencode/OpenCodeProviderSelectionFailure.test.ts --timeout 30000
      - name: Test V2 catalog cache in isolation
        run: bun test src/services/opencode/OpenCodeInventoryService.v2-cache.test.ts --timeout 30000
      - name: Test V2 probe session titles and launch plans in isolation
        if: runner.os != 'Windows'
        run: bun test src/services/opencode/bridge/OpenCodeV2LaunchPlan.unattended.test.ts --timeout 30000
      - name: Test qualified Windows V2 probe session titles
        if: runner.os == 'Windows'
        run: bun test src/services/opencode/bridge/OpenCodeV2LaunchPlan.unattended.test.ts --test-name-pattern 'probe-owned session title' --timeout 30000
      - name: Test Windows startup cleanup completion contracts
        run: bun test src/utils/processKill.test.ts src/services/opencode/OpenCodeStartupCleanupBudget.test.ts src/services/opencode/OpenCodeStartupCleanup.test.ts --timeout 30000
      - name: Test native Windows startup termination
        if: runner.os == 'Windows'
        run: bun test src/services/opencode/OpenCodeStartupCleanup.native.test.ts
      - name: Require Python for Linux OS pipe regression
        if: runner.os == 'Linux'
        run: python3 --version
      - name: Test runtime status and adjacent output boundaries
        # Model defaults use the same provider-scoped status boundary. The real
        # CLI fixture uses portable Bun/Node APIs and a disposable local gateway.
        run: >-
          bun test
          src/cli/handlers/runtime.status-stdout.test.ts
          src/cli/handlers/runtime.providers-stdout.test.ts
          src/cli/handlers/runtime.verify-stdout.test.ts
          src/cli/runtimeStatusCommand.entry.test.ts
          src/cli/effectiveDefaultModel.entry.test.ts
          src/cli/handlers/anthropicCompatibleRuntime.integration.test.ts
          src/cli/handlers/model.test.ts
          src/services/runtimeBackends/effectiveDefaultModel.test.ts
          src/services/runtimeBackends/registry.anthropicCatalog.test.ts
          src/utils/sleep.test.ts
          src/services/teamBootstrap/teamBootstrapOwnedSpec.test.ts
          src/utils/swarm/memberSettingsFile.test.ts
          src/services/opencode/OpenCodeGatewayCredentialSnapshot.test.ts

  opencode-conformance:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    name: OpenCode ${{ matrix.version }} conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            version: '1.18.4'
            asset: opencode-linux-x64.tar.gz
            archiveSha256: bab463c3fb3224d388bb7cfad63f38703df9cf0be2cfd2ce8cb49d886b53a174
          - os: ubuntu-latest
            version: '1.18.29'
            asset: opencode-linux-x64.tar.gz
            archiveSha256: ea800b7ff56226b70952126c9fc1e2517ca4c4b5682fd9d3f9e87449697a1194
          - os: windows-latest
            version: '1.18.29'
            asset: opencode-windows-x64.zip
            archiveSha256: b32618aa3d1415f6e4f473aec248edef25759203fb707d7d968359d86d4a35ee
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ runner.os == 'Windows' && '1.4.3' || '1.3.11' }}
      - name: Install conformance test dependencies
        run: bun install --frozen-lockfile
      - name: Download and verify pinned OpenCode archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED_VERSION: ${{ matrix.version }}
          PINNED_ASSET: ${{ matrix.asset }}
          PINNED_SHA256: ${{ matrix.archiveSha256 }}
        run: |
          $binaryRoot = Join-Path $env:RUNNER_TEMP 'opencode-authority-binary-TEST'
          New-Item -ItemType Directory -Path $binaryRoot | Out-Null
          gh release download "v$env:PINNED_VERSION" --repo anomalyco/opencode --pattern $env:PINNED_ASSET --dir $binaryRoot
          if ($LASTEXITCODE -ne 0) { throw 'Pinned download failed' }
          $archive = Join-Path $binaryRoot $env:PINNED_ASSET
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PINNED_SHA256) { throw 'Pinned archive digest mismatch' }
          if ($IsWindows) {
            Expand-Archive -Path $archive -DestinationPath $binaryRoot
            $binary = Join-Path $binaryRoot 'opencode.exe'
          } else {
            tar -xzf $archive -C $binaryRoot
            if ($LASTEXITCODE -ne 0) { throw 'Pinned extraction failed' }
            $binary = Join-Path $binaryRoot 'opencode'
          }
          "AUTHORITY_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append
          "AUTHORITY_BINARY_SHA256=$((Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test harness and real OpenCode without inference
        shell: pwsh
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          bun test scripts/opencode-authority-conformance.test.ts
          if ($LASTEXITCODE -ne 0) { throw 'Conformance harness tests failed' }
          foreach ($permissionMode in @('auto', 'manual')) {
            bun scripts/opencode-authority-conformance.ts $env:AUTHORITY_BINARY $env:PINNED_VERSION $env:AUTHORITY_BINARY_SHA256 $permissionMode > "conformance-$permissionMode.json"
            if ($LASTEXITCODE -ne 0) { throw "Real OpenCode $permissionMode conformance failed" }
          }
          if (-not $IsWindows) {
            bun scripts/opencode-permission-conformance.ts $env:AUTHORITY_BINARY $env:PINNED_VERSION $env:AUTHORITY_BINARY_SHA256 > conformance-permission.json
            if ($LASTEXITCODE -ne 0) { throw 'Real permission engine conformance failed' }
          }
      - name: Full selected authority with connected MCP in isolated container
        if: runner.os == 'Linux'
        shell: pwsh
        env:
          PINNED_VERSION: ${{ matrix.version }}
        run: |
          bun build scripts/opencode-selected-authority-conformance.ts --target=bun --packages=bundle --define 'process.env.USER_TYPE="external"' --outfile=selected-authority-harness.js
          if ($LASTEXITCODE -ne 0) { throw 'Selected authority harness build failed' }
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec,size=512m --memory 1g --cpus 1 -v "${env:GITHUB_WORKSPACE}/selected-authority-harness.js:/harness.js:ro" -v "${env:AUTHORITY_BINARY}:/opencode:ro" oven/bun@sha256:0733e50325078969732ebe3b15ce4c4be5082f18c4ac1a0f0ca4839c2e4e42a7 bun /harness.js /opencode $env:PINNED_VERSION $env:AUTHORITY_BINARY_SHA256 > conformance-selected-authority.json
          if ($LASTEXITCODE -ne 0) { throw 'Full selected authority conformance failed' }
      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-conformance-${{ matrix.os }}-${{ matrix.version }}
          path: conformance-*.json
          if-no-files-found: ignore

  packaged-delivery:
    name: Packaged delivery (${{ matrix.platform }})
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: ${{ matrix.os }}
    # Windows also proves a real source owner with its production readiness and stop budgets.
    timeout-minutes: ${{ matrix.platform != 'linux-x64' && 35 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            executable: claude-multimodel
            binary: dist/cli
          - os: windows-latest
            platform: win32-x64
            executable: claude-multimodel.exe
            binary: dist/cli.exe
          - os: windows-11-arm
            platform: win32-arm64
            executable: claude-multimodel.exe
            binary: dist/cli.exe
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require the native target architecture
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node -e 'if (`${process.platform}-${process.arch}` !== process.env.CANDIDATE_PLATFORM) throw new Error("Node is not native to the candidate platform")'
          bun --no-install -e 'if (`${process.platform}-${process.arch}` !== process.env.CANDIDATE_PLATFORM) throw new Error("Bun is not native to the candidate platform")'
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - name: Install frozen portable dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Test native compiled delegation and cancellation
        run: bun test src/services/opencode/OpenCodeLoadingBudget.test.ts src/services/opencode/host/OpenCodeHostNativeAdapter.loading.test.ts src/services/opencode/transport/OpenCodeBoundedFetch.loading.test.ts src/cli/packagedOpenCodeDelivery.test.ts scripts/opencode-v2/native-video.test.ts scripts/opencode-v2/native-windows-execution-smoke.test.ts scripts/opencode-v2/stage.test.ts scripts/opencode-v2/stage-copy.test.ts scripts/opencode-v2/staged-files.test.ts src/services/opencode/host/OpenCodeV2ExecutionAuth.test.ts src/services/opencode/host/OpenCodeV2ExecutionPlatform.test.ts src/services/opencode/host/OpenCodeV2PlainExecution.test.ts src/services/opencode/profile/OpenCodeV2ExecutionConfig.test.ts src/services/opencode/host/OpenCodeV2ExecutionLifecycle.test.ts src/features/runtimeProviderManagement/adapters/opencode/OpenCodeV2ProviderManagement.test.ts
      - name: Test Windows receipt architecture admission
        if: runner.os == 'Windows'
        run: bun test src/services/opencode/profile/OpenCodeV2ExecutionReceipt.test.ts --test-name-pattern Windows
      - name: Produce physical JS and native front door
        run: bun --no-install scripts/package-runtime.ts --platform ${{ matrix.platform }}
      - name: Verify the qualified native Windows OpenCode CLI
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: |
          $ErrorActionPreference = 'Stop'
          $descriptor = Get-Content dist/opencode-v2-delivery.json -Raw | ConvertFrom-Json
          $arch = $env:CANDIDATE_PLATFORM.Split('-')[1]
          if ($descriptor.platform -cne 'win32' -or $descriptor.arch -cne $arch) { throw 'V2 candidate platform mismatch' }
          $version = $descriptor.engineVersions[-1]
          $packageName = "@opencode/cli-windows-$arch"
          $root = Join-Path $env:RUNNER_TEMP "TEST-opencode-v2-cli-$arch"
          npm install --prefix $root --ignore-scripts --no-audit --no-fund "${packageName}@${version}"
          if ($LASTEXITCODE -ne 0) { throw 'Qualified native CLI install failed' }
          $packageRoot = Join-Path $root "node_modules/$packageName"
          $metadata = Get-Content (Join-Path $packageRoot 'package.json') -Raw | ConvertFrom-Json
          if ($metadata.name -cne $packageName -or $metadata.version -cne $version) { throw 'Native CLI package identity mismatch' }
          $binary = Join-Path $packageRoot 'bin/opencode.exe'
          $bytes = [IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw 'Native CLI DOS header mismatch' }
          $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($pe -lt 64 -or $pe + 6 -gt $bytes.Length -or [BitConverter]::ToUInt32($bytes, $pe) -ne 0x00004550) { throw 'Native CLI PE header mismatch' }
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          $expectedMachine = if ($arch -ceq 'arm64') { 0xaa64 } else { 0x8664 }
          if ($machine -ne $expectedMachine) { throw 'Native CLI PE architecture mismatch' }
          $reported = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $reported -cnotin @($version, "opencode v$version")) { throw 'Native CLI version mismatch' }
          @{ platform = $env:CANDIDATE_PLATFORM; package = $packageName; version = $reported; machine = ('0x{0:x4}' -f $machine); sha256 = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLowerInvariant() } | ConvertTo-Json | Set-Content "native-v2-cli-$env:CANDIDATE_PLATFORM.json"
          "V2_NATIVE_CLI=$binary" >> $env:GITHUB_ENV
      - name: Verify and archive complete candidate delivery
        id: candidate-delivery
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          CANDIDATE_EXECUTABLE: ${{ matrix.executable }}
          CANDIDATE_BINARY: ${{ matrix.binary }}
          CANDIDATE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          "$CANDIDATE_BINARY" --version | grep -Fx '2.777.777 (Claude Code)'
          mkdir -p candidate/runtime
          bun --no-install scripts/ci/verify-packaged-delivery.ts
          cp "$CANDIDATE_BINARY" "candidate/runtime/$CANDIDATE_EXECUTABLE"
          cp dist/opencode-delivery.json candidate/runtime/opencode-delivery.json
          cp dist/opencode-v2-delivery.json candidate/runtime/opencode-v2-delivery.json
          cp -R dist/local-cli dist/bun dist/cursor-managed candidate/runtime/
          cp dist/opencode-v2-delivery.json candidate/opencode-v2-delivery.json
          support_archive="$(bun --no-install -e 'console.log(JSON.parse(await Bun.file("dist/opencode-v2-delivery.json").text()).archive.file)')"
          cp "dist/$support_archive" candidate/
          printf '%s\n' "$CANDIDATE_SOURCE_SHA" > candidate/runtime/COMMIT_SHA
          tar -czf "candidate-$CANDIDATE_PLATFORM.tar.gz" -C candidate .
      - name: Serve every staged V2 graph from the extracted candidate archive
        timeout-minutes: 10
        shell: bash
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Outside the checkout, so module resolution cannot fall back to the source install.
          # Git Bash tar reads a drive-letter path (D:\a\_temp) as a remote host, so use the POSIX form.
          temp="$RUNNER_TEMP"
          if [[ "$CANDIDATE_PLATFORM" == win32-* ]]; then temp="$(cygpath -u "$RUNNER_TEMP")"; fi
          extracted="$temp/TEST-packaged-server-smoke"
          rm -rf "$extracted"
          mkdir -p "$extracted"
          tar -xzf "candidate-$CANDIDATE_PLATFORM.tar.gz" -C "$extracted"
          shipped_bun="$extracted/runtime/bun/bun"
          if [[ "$CANDIDATE_PLATFORM" == win32-* ]]; then shipped_bun="$extracted/runtime/bun/bun.exe"; fi
          support_archive="$(bun --no-install -e 'console.log(JSON.parse(await Bun.file(process.argv[1]).text()).archive.file)' "$extracted/opencode-v2-delivery.json")"
          mkdir -p "$extracted/support"
          unzip -q "$extracted/$support_archive" -d "$extracted/support"
          "$shipped_bun" --no-install --no-env-file scripts/opencode-v2/packaged-server-smoke.ts "$extracted/runtime" "$extracted/support" "packaged-server-smoke-$CANDIDATE_PLATFORM.json"
          if [[ "$CANDIDATE_PLATFORM" == win32-* ]]; then
            "$shipped_bun" --no-install --no-env-file scripts/opencode-v2/packaged-pty-smoke.ts "$extracted/runtime" "$extracted/support" "packaged-pty-smoke-$CANDIDATE_PLATFORM.json" "$CANDIDATE_PLATFORM"
          fi
      - name: Prove native Windows V2 source launch, MCP readiness and physical stop
        if: runner.os == 'Windows'
        timeout-minutes: 8
        shell: pwsh
        env:
          CANDIDATE_PLATFORM: ${{ matrix.platform }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shippedBun = Join-Path $env:RUNNER_TEMP 'TEST-packaged-server-smoke/runtime/bun/bun.exe'
          # -CommandType enumerates PATH matches; an array would shift the receipt argument.
          $nodeCommands = @(Get-Command node -CommandType Application -ErrorAction Stop)
          $node = ($nodeCommands | Select-Object -First 1).Source
          if ($node -isnot [string] -or -not (Test-Path $node -PathType Leaf)) { throw 'One physical Node executable is required' }
          Write-Output "Controller Node matches: $($nodeCommands.Count); selected: $node"
          & $shippedBun --no-install --no-env-file scripts/opencode-v2/native-windows-execution-smoke.ts $env:V2_NATIVE_CLI $node "native-v2-execution-$env:CANDIDATE_PLATFORM.json" $env:CANDIDATE_PLATFORM
          if ($LASTEXITCODE -ne 0) { throw 'Native V2 source execution proof failed' }
      - name: Preserve staged V2 and native CLI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-server-smoke-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            packaged-server-smoke-${{ matrix.platform }}.json
            packaged-pty-smoke-${{ matrix.platform }}.json
            native-v2-cli-${{ matrix.platform }}.json
            native-v2-execution-${{ matrix.platform }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve exact-head candidate archive
        if: always() && steps.candidate-delivery.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: packaged-delivery-${{ matrix.platform }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  opencode-v2-linux:
    needs: scope
    if: needs.scope.outputs.v2_linux == 'true'
    name: OpenCode V2 Linux execution
    # A real V2 child on ubuntu-24.04. No model request, no credential. See the script header
    # for the regression that no Linux job could catch before this lane.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frozen portable dependencies
        run: bun install --frozen-lockfile --linker hoisted
      # Plain execution and permission tests run in packaged-delivery on Linux and Windows.
      - name: Test readiness, refusal text and activation deadline
        run: bun test src/services/opencode/host/OpenCodeV2ExecutionReadiness.test.ts src/services/opencode/execution/OpenCodeV2RefusalReason.test.ts src/services/opencode/execution/OpenCodeV2ActivationDeadline.test.ts
      - name: Produce the packaged linux-x64 delivery
        run: bun scripts/package-runtime.ts --platform linux-x64
      - name: Start every qualified V2 version
        run: bash scripts/ci/opencode-v2-linux-execution.sh dist
      - name: Preserve sanitized V2 Linux receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-v2-linux-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/TEST-opencode-v2-linux/TEST-v2-*/models.json
            ${{ runner.temp }}/TEST-opencode-v2-linux/TEST-v2-*/status.json

  required:
    name: CI required
    if: always() && !cancelled()
    needs: [scope, cursor-managed-plugin, task-change-ledger, opencode-authority, windows-packaged-backfill, opencode-conformance, packaged-delivery, opencode-v2-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Require every selected check and explain optional skips
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/policy.ts aggregate >> "$GITHUB_STEP_SUMMARY"
