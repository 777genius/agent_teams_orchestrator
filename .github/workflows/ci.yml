name: TEST Windows 121 live PID diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 1e97747ca0581f04c15a4dd5a8365b992bfb295e
          path: runtime
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install immutable frozen dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile
      - name: Observe one unchanged rotated test
        shell: pwsh
        run: |
          $source = git -C runtime rev-parse HEAD
          if ($source -ne '1e97747ca0581f04c15a4dd5a8365b992bfb295e') { throw 'Source mismatch' }
          $patchPath = Join-Path $env:GITHUB_WORKSPACE 'harness/scripts/diagnostic/windows121-live-pid-observation.patch'
          $patchText = [IO.File]::ReadAllText($patchPath).Replace("`r`n", "`n")
          if ($patchText.Contains("`r")) { throw 'Unexpected patch carriage return' }
          [IO.File]::WriteAllText($patchPath, $patchText, [Text.UTF8Encoding]::new($false))
          git -C runtime apply ../harness/scripts/diagnostic/windows121-live-pid-observation.patch
          if ($LASTEXITCODE -ne 0) { throw 'Observation patch mismatch' }
          New-Item -ItemType Directory runtime/scripts/diagnostic -Force | Out-Null
          Copy-Item harness/scripts/diagnostic/windows121-live-pid-trace.ts runtime/scripts/diagnostic/
          Copy-Item harness/scripts/diagnostic/windows121-run-focused.ts runtime/scripts/diagnostic/
          $env:TEST_SOURCE_COMMIT = $source
          $env:TEST_HARNESS_COMMIT = git -C harness rev-parse HEAD
          $env:TEST_LIVE_PID_TRACE = "$env:GITHUB_WORKSPACE/live-pid-trace.jsonl"
          $env:TEST_LIVE_PID_RECEIPT = "$env:GITHUB_WORKSPACE/live-pid-receipt.json"
          Set-Location runtime
          bun scripts/diagnostic/windows121-run-focused.ts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic or focused test failed; retain finite evidence' }
      - name: Preserve finite chronology only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST-windows121-live-pid
          path: |
            live-pid-trace.jsonl
            live-pid-receipt.json
          if-no-files-found: error
