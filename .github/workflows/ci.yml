name: TEST Windows 110 version ownership diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: d64fda3f249153e1d6a828817343a508053099b9
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent-teams-ai
          ref: 209bdab0c2d09c0b14dd186d55a70701fc470712
          path: product
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/stage-opencode-console-wrapper.mjs
            /tools/opencode-console-wrapper/OpenCodeConsoleWrapper.cs
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install immutable frozen dependencies
        working-directory: runtime
        run: bun install --frozen-lockfile
      - name: Apply TEST observation patch and run once
        shell: pwsh
        run: |
          $source = git -C runtime rev-parse HEAD
          if ($source -ne 'd64fda3f249153e1d6a828817343a508053099b9') { throw 'Source mismatch' }
          # Checkout may convert patch context lines to CRLF; git requires LF patch syntax.
          $patchPath = Join-Path $env:GITHUB_WORKSPACE 'harness/scripts/diagnostic/windows110-observation.patch'
          $patchText = [IO.File]::ReadAllText($patchPath).Replace("`r`n", "`n")
          if ($patchText.Contains("`r")) { throw 'Unexpected patch carriage return' }
          [IO.File]::WriteAllText($patchPath, $patchText, [Text.UTF8Encoding]::new($false))
          git -C runtime apply ../harness/scripts/diagnostic/windows110-observation.patch
          if ($LASTEXITCODE -ne 0) { throw 'Observation patch mismatch' }
          New-Item -ItemType Directory runtime/scripts/diagnostic -Force | Out-Null
          Copy-Item harness/scripts/diagnostic/windows110-version-probe.ts runtime/scripts/diagnostic/
          $env:TEST_SOURCE_COMMIT = $source
          $product = git -C product rev-parse HEAD
          if ($product -ne '209bdab0c2d09c0b14dd186d55a70701fc470712') { throw 'Product source mismatch' }
          node product/scripts/stage-opencode-console-wrapper.mjs --platform win32-x64 --require
          if ($LASTEXITCODE -ne 0) { throw 'Product wrapper build failed' }
          $env:TEST_PRODUCT_SOURCE_COMMIT = $product
          $env:TEST_WRAPPER_EXECUTABLE = "$env:GITHUB_WORKSPACE/product/resources/runtime/opencode-console/opencode.exe"
          $env:TEST_WRAPPER_SOURCE_FILE = "$env:GITHUB_WORKSPACE/product/tools/opencode-console-wrapper/OpenCodeConsoleWrapper.cs"
          $env:TEST_WRAPPER_PRODUCER_FILE = "$env:GITHUB_WORKSPACE/product/scripts/stage-opencode-console-wrapper.mjs"
          $env:TEST_VERSION_DIAGNOSTIC_TRACE = "$env:GITHUB_WORKSPACE/version-ownership-trace.jsonl"
          $env:TEST_VERSION_DIAGNOSTIC_RESULT = "$env:GITHUB_WORKSPACE/version-ownership-result.json"
          bun runtime/scripts/diagnostic/windows110-version-probe.ts
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic execution failed' }
      - name: Preserve finite chronology
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TEST-windows110-version-ownership
          path: |
            version-ownership-trace.jsonl
            version-ownership-result.json
          if-no-files-found: warn
