name: Release Runtime

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build, for example main or v2.1.87
        required: false
        type: string
      runtime_version:
        description: Runtime version label, for example 2.1.87
        required: false
        type: string
      target_release_repo:
        description: Public repo that should receive the runtime assets
        required: false
        default: 777genius/claude_agent_teams_ui
        type: string
      target_release_tag:
        description: Release tag in the public repo, for example v1.4.0
        required: false
        type: string

permissions:
  contents: read

env:
  DEFAULT_TARGET_RELEASE_REPO: 777genius/claude_agent_teams_ui

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x64
            archive_name: agent-teams-runtime-linux-x64.tar.gz
            binary_name: claude-multimodel
          - runner: windows-latest
            platform: win32-x64
            archive_name: agent-teams-runtime-win32-x64.zip
            binary_name: claude-multimodel.exe
          - runner: macos-14
            platform: darwin-arm64
            archive_name: agent-teams-runtime-darwin-arm64.tar.gz
            binary_name: claude-multimodel
          - runner: macos-15-intel
            platform: darwin-x64
            archive_name: agent-teams-runtime-darwin-x64.tar.gz
            binary_name: claude-multimodel

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.source_ref || github.ref }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile runtime
        run: bun run compile

      - name: Package runtime archive
        if: runner.os != 'Windows'
        env:
          RAW_RUNTIME_VERSION: ${{ github.event.inputs.runtime_version || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_version="${RAW_RUNTIME_VERSION#v}"
          src=""
          for candidate in dist/cli dist/cli.exe; do
            if [[ -f "$candidate" ]]; then
              src="$candidate"
              break
            fi
          done
          [[ -n "$src" ]] || { echo "Compiled runtime binary not found"; exit 1; }

          rm -rf release
          mkdir -p release/runtime
          cp "$src" "release/runtime/${{ matrix.binary_name }}"
          chmod +x "release/runtime/${{ matrix.binary_name }}"
          printf '%s\n' "$runtime_version" > release/runtime/VERSION
          printf '%s\n' "${{ github.sha }}" > release/runtime/COMMIT_SHA
          tar -czf "release/${{ matrix.archive_name }}" -C release runtime

      - name: Package runtime archive (Windows)
        if: runner.os == 'Windows'
        env:
          RAW_RUNTIME_VERSION: ${{ github.event.inputs.runtime_version || github.ref_name }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeVersion = $env:RAW_RUNTIME_VERSION
          if ($runtimeVersion.StartsWith("v")) {
            $runtimeVersion = $runtimeVersion.Substring(1)
          }
          $source = @("dist/cli.exe", "dist/cli") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $source) {
            throw "Compiled runtime binary not found"
          }

          Remove-Item release -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path release/runtime | Out-Null
          Copy-Item $source "release/runtime/${{ matrix.binary_name }}"
          Set-Content -Path release/runtime/VERSION -Value $runtimeVersion
          Set-Content -Path release/runtime/COMMIT_SHA -Value "${{ github.sha }}"
          Compress-Archive -Path release/runtime -DestinationPath "release/${{ matrix.archive_name }}" -Force

      - name: Upload packaged runtime
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.platform }}
          path: release/${{ matrix.archive_name }}
          retention-days: 3

  publish:
    name: Publish runtime assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Resolve publish metadata
        id: meta
        shell: bash
        env:
          INPUT_TARGET_RELEASE_REPO: ${{ github.event.inputs.target_release_repo }}
          INPUT_TARGET_RELEASE_TAG: ${{ github.event.inputs.target_release_tag }}
          INPUT_RUNTIME_VERSION: ${{ github.event.inputs.runtime_version }}
        run: |
          set -euo pipefail
          target_repo="${INPUT_TARGET_RELEASE_REPO:-${DEFAULT_TARGET_RELEASE_REPO}}"
          target_tag="${INPUT_TARGET_RELEASE_TAG:-${GITHUB_REF_NAME}}"
          runtime_version="${INPUT_RUNTIME_VERSION:-${GITHUB_REF_NAME}}"
          runtime_version="${runtime_version#v}"
          echo "target_repo=$target_repo" >> "$GITHUB_OUTPUT"
          echo "target_tag=$target_tag" >> "$GITHUB_OUTPUT"
          echo "runtime_version=$runtime_version" >> "$GITHUB_OUTPUT"

      - name: Download packaged runtimes
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Flatten downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-flat
          find release-assets -type f -maxdepth 2 -print -exec cp {} release-flat/ \;

      - name: Rename archives to versioned asset names
        env:
          RUNTIME_VERSION: ${{ steps.meta.outputs.runtime_version }}
        shell: bash
        run: |
          set -euo pipefail
          mv "release-flat/agent-teams-runtime-darwin-arm64.tar.gz" "release-flat/agent-teams-runtime-darwin-arm64-v${RUNTIME_VERSION}.tar.gz"
          mv "release-flat/agent-teams-runtime-darwin-x64.tar.gz" "release-flat/agent-teams-runtime-darwin-x64-v${RUNTIME_VERSION}.tar.gz"
          mv "release-flat/agent-teams-runtime-linux-x64.tar.gz" "release-flat/agent-teams-runtime-linux-x64-v${RUNTIME_VERSION}.tar.gz"
          mv "release-flat/agent-teams-runtime-win32-x64.zip" "release-flat/agent-teams-runtime-win32-x64-v${RUNTIME_VERSION}.zip"

      - name: Generate manifest and checksums
        env:
          TARGET_RELEASE_TAG: ${{ steps.meta.outputs.target_tag }}
          RUNTIME_VERSION: ${{ steps.meta.outputs.runtime_version }}
        shell: bash
        run: |
          set -euo pipefail
          bun run ./scripts/generate-release-manifest.ts

      - name: Create target release if needed
        env:
          GH_TOKEN: ${{ secrets.BINARIES_PUBLISH_TOKEN }}
          TARGET_RELEASE_REPO: ${{ steps.meta.outputs.target_repo }}
          TARGET_RELEASE_TAG: ${{ steps.meta.outputs.target_tag }}
          RUNTIME_VERSION: ${{ steps.meta.outputs.runtime_version }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TARGET_RELEASE_TAG" --repo "$TARGET_RELEASE_REPO" >/dev/null 2>&1 || \
            gh release create "$TARGET_RELEASE_TAG" \
              --repo "$TARGET_RELEASE_REPO" \
              --title "$TARGET_RELEASE_TAG" \
              --notes "Release assets for $TARGET_RELEASE_TAG"

      - name: Upload runtime assets to target release
        env:
          GH_TOKEN: ${{ secrets.BINARIES_PUBLISH_TOKEN }}
          TARGET_RELEASE_REPO: ${{ steps.meta.outputs.target_repo }}
          TARGET_RELEASE_TAG: ${{ steps.meta.outputs.target_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TARGET_RELEASE_TAG" release-flat/* --repo "$TARGET_RELEASE_REPO" --clobber
