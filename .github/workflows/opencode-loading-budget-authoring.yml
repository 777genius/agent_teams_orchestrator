name: OpenCode loading budget candidate
on:
  push:
    branches: [fix/opencode-three-minute-loading]
permissions:
  contents: read
jobs:
  candidate:
    if: github.repository == '777genius/agent_teams_orchestrator' && github.ref == 'refs/heads/fix/opencode-three-minute-loading'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Reproduce the old shared 30-second ceiling
        shell: bash
        run: |
          set +e
          bun src/services/opencode/host/fixtures/readHostLoadingBudget.ts slow > original-loading-failure.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'Slow startup must succeed: Error: timeout' original-loading-failure.log
      - name: Apply the exact scoped patch
        id: apply
        run: |
          node .github/apply-opencode-loading-budget.ts
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/services/opencode/OpenCodeClientFactory.test.ts';
          const before = '[30_000, 15_000, 15_000, 5_000]';
          const content = readFileSync(file, 'utf8');
          assert.equal(content.split(before).length - 1, 1);
          writeFileSync(file, content.replace(before, '[180_000, 15_000, 15_000, 5_000]'));
          const paths = JSON.parse(readFileSync('loading-budget-files.json', 'utf8'));
          paths.push(file);
          writeFileSync('loading-budget-files.json', JSON.stringify(paths));
          JS
      - name: Test loading, caller cancellation and unchanged cleanup
        shell: bash
        run: |
          set -euo pipefail
          export TEST_OPENCODE_NODE_BINARY="$(command -v node)"
          for suite in \
            src/services/opencode/OpenCodeLoadingBudget.test.ts \
            src/services/opencode/host/OpenCodeHostNativeAdapter.loading.test.ts \
            src/services/opencode/transport/OpenCodeBoundedFetch.loading.test.ts \
            src/services/opencode/transport/OpenCodeBoundedFetch.test.ts \
            src/services/opencode/OpenCodeClientFactory.test.ts \
            src/services/opencode/OpenCodeStartupCleanupBudget.test.ts \
            src/services/opencode/execution/OpenCodeV2ActivationDeadline.test.ts; do
            bun test "$suite"
          done
      - name: Export exact candidate blobs without changing refs
        if: always() && steps.apply.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync, writeFileSync } from 'node:fs';
          const paths = JSON.parse(readFileSync('loading-budget-files.json', 'utf8'));
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          assert.equal(paths.length, 14);
          assert.deepEqual(git('diff', '--name-only').split('\n').filter(Boolean).sort(), [...paths].sort());
          const entries = [];
          writeFileSync('candidate.patch', execFileSync('git', ['diff'], { encoding: 'utf8' }));
          for (const path of paths) {
            const response = await fetch('https://api.github.com/repos/777genius/agent_teams_orchestrator/git/blobs', {
              method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github+json' },
              body: JSON.stringify({ content: readFileSync(path, 'utf8'), encoding: 'utf-8' }), signal: AbortSignal.timeout(60000),
            });
            assert(response.ok, `Blob upload failed: ${response.status}`);
            const { sha } = await response.json(); assert.match(sha, /^[a-f0-9]{40}$/);
            entries.push({ path, mode: '100644', type: 'blob', sha });
          }
          const receipt = { parent: git('rev-parse', 'HEAD'), baseTree: git('rev-parse', 'HEAD^{tree}'), entries };
          writeFileSync('candidate-tree.json', JSON.stringify(receipt, null, 2) + '\n');
          console.log(JSON.stringify(receipt));
          JS
      - name: Retain candidate diff and reproduction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencode-loading-budget-candidate
          path: |
            candidate-tree.json
            candidate.patch
            original-loading-failure.log
          if-no-files-found: warn
          retention-days: 7
