name: OpenCode V2 retained desktop diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/opencode-v2-retained-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  retained-desktop:
    if: github.event.pull_request.number == 189 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: '54f4e96059edf9b6ceb8471022a7138c8b4766a1'
          path: runtime
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: 777genius/agent-teams-ai
          ref: 'da1ef5825aa9287581d91f1acea3a03ab49485d2'
          path: desktop
          persist-credentials: false
      - name: Retain exact source snapshots without credentials or generated state
        shell: bash
        run: |
          set -euo pipefail
          mkdir TEST-v2-source-snapshots
          git -C runtime archive --format=tar.gz HEAD > TEST-v2-source-snapshots/runtime.tar.gz
          git -C desktop archive --format=tar.gz HEAD > TEST-v2-source-snapshots/desktop.tar.gz
          git -C runtime rev-parse HEAD > TEST-v2-source-snapshots/runtime.sha
          git -C desktop rev-parse HEAD > TEST-v2-source-snapshots/desktop.sha
      - uses: actions/upload-artifact@v4
        with:
          name: TEST-v2-source-snapshots
          path: TEST-v2-source-snapshots/
          retention-days: 1
          if-no-files-found: error
