name: OpenCode V2 retained desktop diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/opencode-v2-retained-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  retained-desktop:
    if: github.event.pull_request.number == 189 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the original isolated desktop failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/TEST-v2-retained-desktop"
          mkdir -p "$evidence"
          gh run download 40936870333 --repo 777genius/agent_teams_orchestrator \
            --name opencode-v2-desktop-lifecycle-de8ba2ab8fcf646ee5d4c3d12438f6b5b30b1454 \
            --dir "$evidence"
          python3 - "$evidence" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for name in ('result.json', 'failure.json'):
              value = json.loads((root / name).read_text())
              keys = ('ok', 'error', 'phases', 'modelRequests', 'fixtureFailures') if name == 'result.json' else ('loading', 'error', 'viewport', 'text')
              print(name, json.dumps({key: value.get(key) for key in keys}, ensure_ascii=False))
          PY
