name: OpenCode loading review fixes
on:
  push:
    branches: [fix/opencode-three-minute-loading]
    paths: [.github/workflows/opencode-loading-review-fixes.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == '777genius/agent_teams_orchestrator' && github.ref == 'refs/heads/fix/opencode-three-minute-loading'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile --linker hoisted
      - name: Update only verified obsolete loading expectations
        id: edit
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          assert.equal(execFileSync('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),'d1a26d0bc978a790a6d9bdd455e7386fdf74575e');
          function replace(file, pairs) {
            let text=readFileSync(file,'utf8');
            for(const [before,after,count] of pairs) {
              assert.equal(text.split(before).length-1,count,`Expected reviewed occurrence count in ${file}: ${before}`);
              text=text.replaceAll(before,after);
            }
            writeFileSync(file,text);
          }
          replace('src/services/opencode/OpenCodeInventoryService.test.ts',[
            ['expect(OPEN_CODE_MODEL_LIST_TIMEOUT_MS).toBe(30_000)','expect(OPEN_CODE_MODEL_LIST_TIMEOUT_MS).toBe(180_000)',1],
          ]);
          replace('src/services/opencode/host/OpenCodeV2ExecutionHost.test.ts',[
            ["expect(openCodeV2RunInitializationMs('linux')).toBe(90_000)","expect(openCodeV2RunInitializationMs('linux')).toBe(180_000)",1],
            ["platform === 'win32' ? 120_000 : 60_000",'openCodeV2RunInitializationMs(platform)',3],
            ["// The local 60s watchdog is replaced by the owner's absolute","// The local platform watchdog is replaced by the owner's absolute",1],
          ]);
          JS
      - name: Run inventory and watchdog regressions in isolated processes
        if: steps.edit.outcome == 'success'
        run: |
          bun test src/services/opencode/OpenCodeInventoryService.test.ts
          bun test src/services/opencode/host/OpenCodeV2ExecutionHost.test.ts
      - name: Export reviewed patch blobs without committing or updating refs
        if: always() && steps.edit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync,writeFileSync} from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const paths=['src/services/opencode/OpenCodeInventoryService.test.ts','src/services/opencode/host/OpenCodeV2ExecutionHost.test.ts'];
          assert.deepEqual(git('diff','--name-only').split('\n').sort(),[...paths].sort());
          execFileSync('git',['diff','--check'],{stdio:'inherit'});
          const patch=execFileSync('git',['diff'],{encoding:'utf8'}); console.log(patch); writeFileSync('review-fix.patch',patch);
          const entries=[];
          for(const path of paths){
            const r=await fetch('https://api.github.com/repos/777genius/agent_teams_orchestrator/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content:readFileSync(path,'utf8'),encoding:'utf-8'}),signal:AbortSignal.timeout(60000),
            });
            assert(r.ok,`Blob upload failed: ${r.status}`); const {sha}=await r.json(); assert.match(sha,/^[a-f0-9]{40}$/);
            entries.push({path,mode:'100644',type:'blob',sha});
          }
          const result={parent:git('rev-parse','HEAD'),baseTree:git('rev-parse','HEAD^{tree}'),entries};
          console.log(JSON.stringify(result)); writeFileSync('review-fix.json',JSON.stringify(result,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opencode-loading-review-fixes
          path: |
            review-fix.json
            review-fix.patch
          retention-days: 7
