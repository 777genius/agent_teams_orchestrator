name: Repro OpenCode Windows probe budget
on:
  push:
    branches: [repro/opencode-windows-probe]
permissions:
  contents: read
jobs:
  probe-cost:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Prepare genuine npm OpenCode and public runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP "TEST-opencode-probe-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory $root | Out-Null
          npm install --prefix "$root/npm" --no-audit --no-fund opencode-ai@1.19.2
          if ($LASTEXITCODE -ne 0) { throw 'npm install failed' }
          Get-ChildItem "$root/npm/node_modules/.bin" | Select-Object Name, Length
          Get-Content "$root/npm/node_modules/.bin/opencode.cmd"
          $dest = Join-Path $root 'runtime'
          New-Item -ItemType Directory $dest | Out-Null
          gh release download runtime-v0.0.122 --repo 777genius/agent_teams_orchestrator_binaries --pattern 'agent-teams-runtime-win32-x64-v0.0.122.zip' --dir $dest
          if ($LASTEXITCODE -ne 0) { throw 'runtime download failed' }
          Expand-Archive "$dest/agent-teams-runtime-win32-x64-v0.0.122.zip" "$dest/payload"
          $binary = @(Get-ChildItem "$dest/payload" -Filter claude-multimodel.exe -Recurse)[0].FullName
          "TEST_ROOT=$root" >> $env:GITHUB_ENV
          "RUNTIME=$binary" >> $env:GITHUB_ENV
          "SHIM=$root/npm/node_modules/.bin/opencode.cmd" >> $env:GITHUB_ENV
          "NATIVE=$root/npm/node_modules/opencode-ai/bin/opencode.exe" >> $env:GITHUB_ENV
      - name: Measure helpers and runtime command
        run: node scripts/repro/opencode-windows-probe-cost.mjs "$env:TEST_ROOT" "$env:RUNTIME" "shim=$env:SHIM" "native=$env:NATIVE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-cost-${{ matrix.os }}
          path: ${{ runner.temp }}/TEST-opencode-probe-*/probe-cost-report.json
          if-no-files-found: warn
  ffi-spike:
    if: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, bun: '1.3.11' }
          - { os: windows-2022, bun: '1.4.2' }
          - { os: windows-11-arm, bun: '1.4.2' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Run under bun
        run: bun scripts/repro/windows-ffi-process-table.ts
      - name: Run compiled
        shell: pwsh
        run: |
          bun build --compile scripts/repro/windows-ffi-process-table.ts --outfile ffi-spike.exe
          if ($LASTEXITCODE -ne 0) { throw 'compile failed' }
          .\ffi-spike.exe
          if ($LASTEXITCODE -ne 0) { throw 'compiled spike failed' }
  calibrate:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/oc" --no-audit --no-fund opencode-ai@1.19.2
          node scripts/repro/opencode-windows-calibrate.mjs "$env:RUNNER_TEMP/oc/node_modules/.bin/opencode.cmd" "$env:RUNNER_TEMP/oc/node_modules/opencode-ai/bin/opencode.exe"
  ffi-arm:
    if: false
    strategy:
      fail-fast: false
      matrix:
        bun: ['1.3.11', '1.3.12', '1.4.0', '1.4.2']
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun --version; bun scripts/repro/ffi-probe.ts
      - name: x64 baseline 1.3.11 under emulation
        if: matrix.bun == '1.3.11'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/oven-sh/bun/releases/download/bun-v1.3.11/bun-windows-aarch64.zip -OutFile a.zip
          Expand-Archive a.zip arm
          & .\arm\bun-windows-aarch64\bun.exe --version
          & .\arm\bun-windows-aarch64\bun.exe scripts/repro/ffi-probe.ts
  verify-published:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install OpenCode like a user and stage published runtimes in the dev cache layout
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g --no-audit --no-fund opencode-ai@latest
          if ($LASTEXITCODE -ne 0) { throw 'global npm install failed' }
          $shim = Join-Path (npm prefix -g) 'opencode.cmd'
          if (-not (Test-Path $shim)) { throw "missing $shim" }
          & $shim --version
          "SHIM=$shim" >> $env:GITHUB_ENV
          foreach ($v in @('0.0.120', '0.0.123')) {
            $tmp = Join-Path $env:RUNNER_TEMP "rt-$v"; New-Item -ItemType Directory $tmp | Out-Null
            gh release download "runtime-v$v" --repo 777genius/agent_teams_orchestrator_binaries --pattern "agent-teams-runtime-win32-x64-v$v.zip" --pattern "agent-teams-runtime-SHA256SUMS-v$v" --dir $tmp
            if ($LASTEXITCODE -ne 0) { throw "download $v failed" }
            $zip = "$tmp/agent-teams-runtime-win32-x64-v$v.zip"
            $line = Get-Content "$tmp/agent-teams-runtime-SHA256SUMS-v$v" | Where-Object { $_ -match "win32-x64-v$v.zip$" }
            if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne ($line -split '\s+')[0]) { throw "checksum $v" }
            $payload = Join-Path $env:USERPROFILE ".agent-teams/runtime-cache/$v/win32-x64/payload-v1"
            Expand-Archive $zip "$tmp/x"
            $exe = @(Get-ChildItem "$tmp/x" -Filter claude-multimodel.exe -Recurse)[0]
            New-Item -ItemType Directory -Force $payload | Out-Null
            Copy-Item -Recurse "$($exe.Directory.FullName)/*" $payload
            Get-ChildItem $payload | Select-Object Name
          }
      - name: Exact user command, published 0.0.120 vs 0.0.123, idle and under contention
        run: node scripts/repro/verify-published.mjs "$env:SHIM" 0.0.120 0.0.123
